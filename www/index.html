<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>pazpop.net</title>

    <meta name="description" content="Site personnel de pazpop.">
    <meta name="theme-color" content="#1a1a1a">

    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="shortcut icon" type="image/jpg" href="img/favicon.jpg">

    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #1a1a1a;
        background-image: url("img/bg.gif");
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #f5f5f5;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding: 2rem;
        max-width: 24rem;
        text-align: center;
        background-color: rgba(0, 0, 0, 0.55);
        border-radius: 0.5rem;
      }

      .avatar {
        width: 8rem;
        height: 8rem;
        border-radius: 50%;
        object-fit: cover;
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
      }

      p {
        margin: 0;
        opacity: 0.85;
      }

    </style>
  </head>

  <body>
    <main>
      <img class="avatar" src="img/avatar.png" alt="Avatar de pazpop" width="128" height="128" loading="lazy">
      <h1>pazpop.net</h1>
    </main>
  </body>
</html>
